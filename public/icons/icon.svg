<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="100%" stop-color="#161b24" />
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer rounded square background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#00FF66" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- High Voltage Bolt / Anargya EV Wings -->
  <g filter="url(#glow)">
    <!-- Aerodynamic Racing Wing Lines -->
    <path d="M96 280 L220 160 L280 230 L416 110" fill="none" stroke="#00FF66" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M140 370 L240 270 L300 330 L416 230" fill="none" stroke="#FF2A55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Kinetic Bolt -->
    <polygon points="270,120 180,270 250,270 230,390 340,240 270,240" fill="url(#neon-grad)" />
  </g>
  
  <!-- 9TH GEN Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    ANARGYA 9TH GEN
  </text>
  <text x="256" y="470" font-family="monospace" font-size="16" font-weight="bold" fill="#00FF66" text-anchor="middle" letter-spacing="6">
    ITS FORMULA EV
  </text>
</svg>
